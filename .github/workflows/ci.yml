name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build, format, test, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PersonalPlatform.slnx && dotnet tool restore
      - name: Verify formatting
        run: dotnet format PersonalPlatform.slnx --verify-no-changes --no-restore
      - name: Build (warnings are errors, analyzers on)
        run: dotnet build PersonalPlatform.slnx -c Release --no-restore
      - name: Unit tests
        run: >
          dotnet test -c Release --no-build
          --project tests/PersonalPlatform.UnitTests
          --results-directory TestResults --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml --report-trx
      - name: Architecture tests
        run: dotnet test -c Release --no-build --project tests/PersonalPlatform.ArchitectureTests --results-directory TestResults --report-trx
      - name: Integration tests (PostgreSQL via Testcontainers)
        run: >
          dotnet test -c Release --no-build
          --project tests/PersonalPlatform.IntegrationTests
          --results-directory TestResults --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml --report-trx
      - name: Security tests
        run: >
          dotnet test -c Release --no-build
          --project tests/PersonalPlatform.SecurityTests
          --results-directory TestResults --coverage --coverage-output-format cobertura --coverage-output security.cobertura.xml --report-trx
      - name: Check migrations are up to date with the model
        run: dotnet ef migrations has-pending-model-changes --project src/PersonalPlatform.Infrastructure --startup-project src/PersonalPlatform.Infrastructure --no-build --configuration Release
      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura" -assemblyfilters:"+PersonalPlatform.*;-PersonalPlatform.TestInfrastructure"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate (Domain, Application, Infrastructure >= 90% lines)
        run: python3 deploy/ci/check-coverage.py coverage/Cobertura.xml 0.90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**
            coverage/**
          retention-days: 14

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (NuGet audit fails the restore on known vulnerabilities)
        run: dotnet restore PersonalPlatform.slnx
      - name: List vulnerable packages (direct and transitive)
        run: |
          dotnet list PersonalPlatform.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended
      - run: dotnet build PersonalPlatform.slnx -c Release
      - uses: github/codeql-action/analyze@v3

  container:
    name: Container build, lint, scan, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile
      - name: Build images
        run: |
          docker build --target runtime -t personal-platform:ci .
          docker build --target migrator -t personal-platform-migrator:ci .
      - name: Validate compose configuration
        run: |
          ./deploy/scripts/generate-dev-env.sh
          docker compose config -q
          docker compose -f deploy/production/docker-compose.prod.yml --env-file deploy/production/prod.env.example config -q
      - name: Trivy image scan (fail on HIGH/CRITICAL with an available fix)
        run: |
          for image in personal-platform:ci personal-platform-migrator:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Trivy misconfiguration scan (Dockerfile, compose)
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.75.0
          config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: SBOM (CycloneDX, syft)
        run: |
          # syft runs as a non-root user: give it a writable directory and an image archive instead of the
          # Docker socket.
          mkdir -p sbom && chmod a+w sbom
          docker save personal-platform:ci -o sbom/image.tar && chmod a+r sbom/image.tar
          docker run --rm -v "$PWD/sbom:/out" anchore/syft:v1.54.1-nonroot \
            docker-archive:/out/image.tar -o cyclonedx-json=/out/sbom.cdx.json
          rm sbom/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/sbom.cdx.json
