# TLS-terminating reverse proxy in front of the application. Runs unprivileged (uid 101) on ports 8080/8443,
# which the compose file publishes as 80/443 (on IPv4 and IPv6 of the host; container networks are IPv4). Security headers (CSP, HSTS, etc.) are set by the application.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Access log without query strings (they can contain search terms) and without cookies or auth headers.
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    # First line of defence against floods; the application enforces finer per-user and per-endpoint limits.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    upstream app {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Container health check: bound to the container's loopback interface and never published.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /nginx-health {
            return 204;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        limit_conn conn_per_ip 50;

        location / {
            limit_req zone=per_ip burst=60 nodelay;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite (never append to) client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
        }

        # Health endpoints are for the orchestrator, not the internet.
        location /health/ {
            return 404;
        }
    }
}
